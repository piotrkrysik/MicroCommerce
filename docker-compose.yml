version: '3.4'

services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Password123!
    ports:
      - "1433:1433"
  basketdb:
    image: redis:latest
    ports:
      - "6379:6379"
  basket.api:
    build:
      context: .
      dockerfile: Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__ConnectionString=basketdb:6379"
    depends_on:
      - basketdb
    ports:
      - "8001:8080"

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=catalogdb;Database=CatalogDb;User Id=sa;Password=Your_Password123!;TrustServerCertificate=True"
    depends_on:
      - catalogdb
    ports:
      - "8000:8080"
      - "8081:8081"

  apigateway:
    container_name: microcommerce-apigateway
    image: microcommerce-apigateway
    build:
      context: .
      dockerfile: ApiGateway/Dockerfile
    ports:
      - "8010:8080"
    depends_on:
      - catalog.api
      - basket.api
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: microcommerce-rabbitmq
    ports:
      - "5672:5672"   # Port do komunikacji między serwisami
      - "15672:15672" # Port do panelu zarządzania (UI)
  ordering.api:
    image: ${DOCKER_REGISTRY-}orderingapi
    build:
      context: .
      dockerfile: Ordering.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Adres pod którym MassTransit znajdzie RabbitMQ wewnątrz sieci Dockera
      - "EventBusSettings__HostAddress=amqp://guest:guest@rabbitmq:5672"
    depends_on:
      - rabbitmq
    ports:
      - "8002:8080"
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - apigateway
    networks:
      - aspnet-microservices