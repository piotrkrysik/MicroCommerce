version: '3.4'

services:
  catalogdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Password123!
    ports:
      - "1433:1433"
  basketdb:
    image: redis:latest
    ports:
      - "6379:6379"
  basket.api:
    build:
      context: .
      dockerfile: Basket.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "CacheSettings__ConnectionString=basketdb:6379"
    depends_on:
      - basketdb
    ports:
      - "8001:8080"

  catalog.api:
    image: ${DOCKER_REGISTRY-}catalogapi
    build:
      context: .
      dockerfile: Catalog.API/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - "ConnectionStrings__DefaultConnection=Server=catalogdb;Database=CatalogDb;User Id=sa;Password=Your_Password123!;TrustServerCertificate=True"
    depends_on:
      - catalogdb
    ports:
      - "8000:8080"